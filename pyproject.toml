[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "microcopy-lab"
version = "1.0.0"
description = "Local UX writing audits, Ollama suggestions, and component previews"
requires-python = ">=3.12,<3.15"
dependencies = ["streamlit>=1.50,<2", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML", "pip-audit>=2.8,<3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "app.py", "ui", "scripts"]
